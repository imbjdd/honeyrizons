      DB_CONNECTION=pgsql
      DB_HOST=10.0.3.12
      DB_PORT=5432
      DB_DATABASE=billing
      DB_USERNAME=billing
      DB_PASSWORD=St4ging-B1lling-2026

      AWS_ACCESS_KEY_ID=AKIAHONEYRIZONS7LURE
      AWS_SECRET_ACCESS_KEY=hnyrzns/fake/do-not-use/8f3c2a1d9e7b6a5c4d3e
      AWS_DEFAULT_REGION=eu-west-3
