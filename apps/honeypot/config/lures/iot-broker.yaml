apiVersion: "v1"
protocol: "tcp"
wireEncoding: "latin1"
framing:
  # MQTT Remaining Length is a 1-4 byte base-128 varint after the fixed-header byte, so each regex sees one packet.
  mode: "varint-length-prefix"
  lengthOffset: 1
  maxLengthBytes: 4
address: ":1883"
description: "Mosquitto 2.0.18"
# Lure: an open MQTT broker, where IoT botnets go next. Opened when Mirai-style traffic shows up.
banner: ""
commands:
  - regex: "(?s)^\\x10"
    handler: "\x20\x02\x00\x00"
    name: "connect_ack"
  - regex: "(?s)^\\x30"
    handler: "\x40\x02\x00\x00"
    name: "publish_ack"
  - regex: "(?s)^\\x82"
    handler: "\x90\x03\x00\x00\x00"
    name: "subscribe_ack"
  - regex: "(?s)^\\xc0"
    handler: "\xd0\x00"
    name: "ping"
  # Anything else (DISCONNECT, UNSUBSCRIBE...) is logged and left unanswered, like a broker that ignores it.
  - regex: "(?s)^(.+)$"
    handler: ""
    name: "catch_all"
deadlineTimeoutSeconds: 60
serverName: "mosquitto"
